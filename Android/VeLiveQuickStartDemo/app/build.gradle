plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.0"
    defaultConfig {
        configurations.all {
            resolutionStrategy { force 'androidx.core:core:1.6.0' }
        }
        manifestPlaceholders
        ndk {
            // Set SO library architecture, support armv7a and arm64 architecture.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        packagingOptions {
            pickFirst '**/libc++_shared.so'
        }
        // APPLOG_SCHEME is a required parameter, and if it is missing, the compilation will fail.
        // online indicates the live broadcast scene.

        manifestPlaceholders.put("APPLOG_SCHEME", "online")
        applicationId "com.byteplus.ttsdk.quickstart.demo"
        minSdkVersion 21
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 29
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libh265enc.so'
        pickFirst '**/libbytenn.so'
    }
//    ndkVersion '16.1.4479499'
}


dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.annotation:annotation:1.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'commons-net:commons-net:3.6'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    // Add TTSDK online integration address, it is recommended to use the latest stable version, please refer to the [SDK Download] chapter for how to obtain it
     implementation 'com.bytedanceapi:ttsdk-ttlivepush:1.48.200.2'
     implementation 'com.bytedanceapi:ttsdk-ttlivepull_premium:1.48.200.2'
     implementation "com.byteplus:BytePlusRTC:3.58.1.53300"



    api project(path: ':vepicutureinpicture:live')
}
